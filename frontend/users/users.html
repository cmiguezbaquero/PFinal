<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FitPlan - Acceso</title>
  <link rel="stylesheet" href="users.css">
</head>

<body>

<header class="header">
  <h1>FitPlan</h1>
  <p>Tu entrenamiento inteligente</p>
</header>

<main class="auth-container">

  <!-- TOGGLE BUTTONS -->
  <div class="toggle-box">
    <button id="showLogin" class="toggle active">Ya tengo cuenta</button>
    <button id="showRegister" class="toggle">Empezar</button>
  </div>

  <!-- LOGIN -->
  <section id="loginForm" class="panel auth-card">
    <h2>Iniciar sesión</h2>

    <input id="loginEmail" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Contraseña">

    <button onclick="loginUser()">Entrar</button>

    <p class="switch-text">
      ¿No tienes cuenta?
      <span id="goRegister">Regístrate</span>
    </p>
  </section>

  <!-- REGISTER -->
  <section id="registerForm" class="panel auth-card hidden">
    <h2>Crear cuenta</h2>

    <input id="registerName" placeholder="Nombre">
    <input id="registerEmail" placeholder="Email">
    <input id="registerPassword" type="password" placeholder="Contraseña">

    <button onclick="createUser()">Empezar</button>

    <p class="switch-text">
      ¿Ya tienes cuenta?
      <span id="goLogin">Inicia sesión</span>
    </p>
  </section>

</main>

<p id="auth-status" class="auth-status"></p>

<script type="module" src="users.js"></script>

</body>
</html>
