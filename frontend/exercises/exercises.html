<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercises</title>
  <link rel="stylesheet" href="exercises.css">
</head>
<body>

<script src="../shared/api.js"></script>
<script src="exercises.js"></script>

<header class="header">
  <h1>🏋️ Exercises</h1>
  <p>Build your workout</p>
</header>

<main class="container">

  <!-- CREATE -->
  <section class="panel">
    <h2>➕ Add Exercise</h2>
    <input id="name" placeholder="Name">
    <input id="muscle" placeholder="Muscle group">
    <input id="description" placeholder="Description">
    <button onclick="createExercise()">Add</button>
  </section>

  <!-- FILTER -->
  <section class="panel">
    <h2>🎯 Filter</h2>
    <div class="filters">
      <button onclick="filter('ALL')">All</button>
      <button onclick="filter('Pecho')">Pecho</button>
      <button onclick="filter('Pierna')">Pierna</button>
      <button onclick="filter('Espalda')">Espalda</button>
      <button onclick="filter('Brazos')">Brazos</button>
    </div>
  </section>

  <!-- LIST -->
  <section>
    <h2>💪 Exercises</h2>
    <div id="container" class="grid"></div>
  </section>

</main>

</body>
</html>
